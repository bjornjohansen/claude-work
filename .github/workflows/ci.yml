name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so a tag can never ship unlinted or untested code.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint the tool (bash)
        run: shellcheck -x bin/claude-work
      - name: Lint the installer (POSIX sh)
        run: shellcheck -s sh install.sh
      - name: Lint test helpers
        run: shellcheck -x test/helpers/common.bash
      - name: Check the installed command is executable
        run: test -x bin/claude-work

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Script version must match the newest CHANGELOG entry
        run: |
          set -euo pipefail
          script_version=$(sed -n 's/^# Version:[[:space:]]*//p' bin/claude-work | head -n 1)
          changelog_version=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          echo "script:    ${script_version}"
          echo "changelog: ${changelog_version}"
          if [ "$script_version" != "$changelog_version" ]; then
            echo "::error::version drift — bin/claude-work says ${script_version}, CHANGELOG.md says ${changelog_version}"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux and bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux bats
      - name: Install tmux and bats (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux bats-core
      - name: Run the test suite
        run: bats test/

  # The documented bash 3.2 compatibility is only a promise until something
  # checks it. macOS runners still ship 3.2 at /bin/bash.
  test-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm /bin/bash really is 3.2
        run: /bin/bash --version | head -1
      - name: Install tmux and bats
        run: brew install tmux bats-core
      - name: Run the test suite under bash 3.2
        env:
          CW_BASH: /bin/bash
        run: bats test/

  # install.sh is the only distribution channel, so it is exercised on both
  # platforms for every change rather than only at release time.
  test-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install from this commit
        run: |
          set -euo pipefail
          sh install.sh --ref "${GITHUB_SHA}" --prefix "${RUNNER_TEMP}/bin" 2>&1 |
            tee "${RUNNER_TEMP}/install.log"
      # The runners have git but not claude, which is exactly the situation that
      # used to produce "Install git and tmux with: brew install git tmux".
      - name: Dependency hints name only the tools that are missing
        run: |
          set -euo pipefail
          log=$(cat "${RUNNER_TEMP}/install.log")
          case "$log" in
            *"claude.com/claude-code"*) ;;
            *) echo "::error::installer did not point at Claude Code"; exit 1 ;;
          esac
          case "$log" in
            *"install git"*)
              echo "::error::installer suggested installing git, which is present"
              exit 1
              ;;
          esac
      - name: Installed command runs
        run: |
          set -euo pipefail
          test -x "${RUNNER_TEMP}/bin/claude-work"
          out=$("${RUNNER_TEMP}/bin/claude-work" 2>&1 || true)
          echo "$out"
          case "$out" in
            *"Usage: claude-work"*) ;;
            *) echo "::error::installed command did not print usage"; exit 1 ;;
          esac
      - name: Uninstall removes it again
        run: |
          set -euo pipefail
          sh install.sh --uninstall --prefix "${RUNNER_TEMP}/bin"
          test ! -f "${RUNNER_TEMP}/bin/claude-work"
